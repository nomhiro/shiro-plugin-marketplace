# 映り込みを塗る規則（ocr_mask.py）と、塗った後の点検の規則（leak_check_ocr.py）。
#
# このファイルを講座リポジトリにコピーして leak_rules.yaml にし、**.gitignore に入れる**。
# 実際の氏名・メール・アカウント名・ID の断片を書くファイルなので、コミットしない・共有しない。
# <...> の所を自分の値に置き換える。正規表現は大文字小文字を区別しない（label_value を除く）。
# 正規表現は単引用符で囲む（二重引用符だと YAML が \s などをエスケープとして読み、読めなくなる）。

fill: [10, 10, 10]          # 塗る色（黒ベタ。ぼかしは使わない）
template_threshold: 0.88    # template: true の語の照合のしきい値

# 1) 語 → その語の箱を pad [左, 上, 右, 下] だけ広げて塗る
#    🔴 サインイン中の自分の氏名・メールを最初に入れる。入れ忘れると、塗りも点検も同じ規則を読むので、
#       点検は 0 件で通り、名前とメールが残る（AZ-104 L2-1）。値はチャットに出さず、CLI（az ad signed-in-user show など）から
#       スクリプトで足す。足したら、教材として見せる語（グループ名・リソース名）に当たらないかを確かめる
#    🔴 管理画面の**青いリンクの名前**（IAM の一覧など）と**太字の題名**（パネルの見出し）は OCR が読めず、塗りも点検も素通りする
#       （template: true も、最初の1件が読めないと効かない）。名前が出る枚は、切り出しのスクリプトで箱を足し、拡大して目で見る
#    OCR の箱は行ごとなので、2行のセル（名前の下に ID）で ID の箱が上の行にかかることがある。行を raw から戻して狭い箱で塗り直す
words:
  - pattern: "<氏名の一部>|<姓>|<名>"
  - pattern: "<メールのユーザー名>|<メールのドメイン>"
  - pattern: "<テナントのドメインの断片>|onmicrosoft"
  - pattern: "<自宅や職場の IP の先頭>"          # 例: 端末の出力に出る送信元・DNS サーバー
  - pattern: "<他プロジェクトの名前1>|<他プロジェクトの名前2>"
  - pattern: "<サブスクリプション名の一部>"
    pad: [-60, -3, 6, 3]    # 名前の前に付く文字（アイコンや接頭辞）まで塗る
    template: true          # 見つかった切り抜きで全枚数を照合し、OCR の読み落としも塗る

# GitHub・クラウド IDE を撮る講座の典型（必要なものだけ残す）
#  - pattern: "<GitHub のアカウント名>"              # 右上・作者の欄・ターミナルのプロンプト・URL
#  - pattern: "<別のアカウント名>"                   # Fork の確認に使った別のアカウント
#  - pattern: "<組織名>"
#  - pattern: "<Codespace の名前（ランダムな2語）>"   # 例: ステータスバー・タブの題名
#  - pattern: "<ほかのリポジトリの名前1>|<名前2>"     # セッションの一覧・最近のリポジトリ
#  - pattern: '\d+ (seconds|minutes|hours) ago|\d+ 分前|\d+ 秒前'   # 生成 AI の答えの下の時刻
#  - pattern: "premium requests?|AI credits?|クレジット"            # 答えの下の使用量
# アバターは画像なので OCR では見つからない。fixed_boxes で塗る（撮るときのページの拡大ごとに位置を測る）

# 2) ラベルの右にある値を塗る（管理画面が自分でぼかしただけの ID も塗る）
label_value:
  - pattern: 'サブスクリプション\s*ID|Subscription\s*ID'
    width: 300
  - pattern: 'テナント\s*ID|Tenant\s*ID'
    width: 300

# 3) 位置が固定の表示を箱で塗る（右上のアカウント表示など）。except は当てない画像名の正規表現
fixed_boxes:
  - box: [<x0>, <y0>, <x1>, <y1>]
    except: "^S9"           # 例: 端末の画面を S9NN として置く運用なら、その枚は外す
# except を書き誤ると、当たるはずの枚に当たらずアバターが残った。塗った後に、全枚で当たったかを数えて確かめる

# 4) GUID の部分だけを塗る。語りで触れる GUID（リソースに振られた識別子など）は keep に書いて残す
guid:
  enabled: true
  keep: []

# 5) 金額（$1.23・USD など）を含む語を塗る（講座で金額を断定しないなら true）
price: true

# 塗った後の点検で、上の words・guid・price に加えて「1件も読めてはいけない」語
check:
  extra:
    - "/subscriptions/"
    - "<クレジットや利用額の通知の文言>"
